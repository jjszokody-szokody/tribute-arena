<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><link rel="icon" href="data:,"><title>Tribute Arena</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:system-ui,sans-serif;color:#fff;touch-action:none}
canvas{display:block}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,8,6,.92);z-index:20;padding:12px;text-align:center}
.hidden{display:none!important}
h1{margin:4px 0;font-size:clamp(26px,6vw,48px);color:#f5b942;letter-spacing:2px}
#chars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:720px;width:100%}
.ch{background:#2a221a;border:2px solid #554;border-radius:10px;padding:6px;cursor:pointer;font-size:12px}
.ch.sel{border-color:#f5b942;background:#3d3020}
.ch b{font-size:14px;display:block}
.bar{height:5px;background:#222;border-radius:3px;margin:2px 0}.bar i{display:block;height:100%;border-radius:3px}
#preview{width:min(240px,40vw);height:min(200px,28vh)}
button.big{font-size:20px;padding:12px 28px;margin:6px;border:0;border-radius:10px;background:#f5b942;color:#211;font-weight:bold;cursor:pointer}
#hud{position:fixed;left:0;right:0;top:0;padding:8px;padding-top:max(8px,env(safe-area-inset-top));z-index:5;pointer-events:none;font-size:13px;text-shadow:0 1px 2px #000}
.stat{width:min(160px,32vw);height:10px;background:#0008;border-radius:5px;margin:3px 0;overflow:hidden}.stat i{display:block;height:100%}
#count{position:fixed;top:8px;right:10px;z-index:5;font-size:15px;font-weight:bold;text-align:right;text-shadow:0 1px 2px #000;pointer-events:none}
#msg{position:fixed;top:22%;left:0;right:0;text-align:center;font-size:clamp(18px,4vw,30px);font-weight:bold;color:#f5b942;text-shadow:0 2px 4px #000;z-index:6;pointer-events:none;opacity:0;transition:opacity .5s}
#cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#fff8;z-index:5;pointer-events:none}
#hint{position:fixed;bottom:40%;left:0;right:0;text-align:center;z-index:5;pointer-events:none;font-size:15px}
#touch{position:fixed;inset:0;z-index:4;pointer-events:none}
.joy{position:fixed;bottom:max(24px,env(safe-area-inset-bottom));width:130px;height:130px;border-radius:50%;background:#fff1;border:3px solid #fff6;pointer-events:auto;touch-action:none;z-index:6}
#joyL{left:max(20px,env(safe-area-inset-left))}#joyR{right:max(20px,env(safe-area-inset-right))}
.knob{position:absolute;left:37px;top:37px;width:56px;height:56px;border-radius:50%;background:#fff8;border:2px solid #fffc;pointer-events:none}
.joy span{position:absolute;top:-20px;left:0;right:0;text-align:center;font-size:11px;opacity:.7}
#btns{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:calc(max(24px,env(safe-area-inset-bottom)) + 160px);z-index:6;display:grid;grid-template-columns:repeat(2,62px);gap:10px;touch-action:none}
#btns div{width:62px;height:62px;border-radius:50%;background:#0006;border:2px solid #fff7;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold}
#btns div:active{background:#f5b94288}
#danger{position:fixed;inset:0;pointer-events:none;z-index:3;box-shadow:inset 0 0 80px #f30;opacity:0;transition:opacity .3s}
#final{font-size:clamp(20px,5vw,34px);margin:10px}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
</head><body>
<div id="select" class="screen">
 <h1>TRIBUTE ARENA</h1><div style="font-size:13px;opacity:.8">Choose your tribute. Last one standing wins.</div>
 <canvas id="preview"></canvas>
 <div id="chars"></div>
 <button class="big" id="start">Enter the Arena</button>
 <div style="font-size:11px;opacity:.6">Desktop: WASD move · mouse look · click attack · Space jump · E pick up/use · V camera</div>
</div>
<div id="end" class="screen hidden"><h1 id="endTitle">YOU DIED</h1><div id="final"></div>
 <div><button class="big" id="retry">Retry</button><button class="big" id="newchar">Choose new character</button></div></div>
<div id="hud" class="hidden">
 <div>❤ Health<div class="stat"><i id="hp" style="background:#e33"></i></div></div>
 <div>🍖 Hunger<div class="stat"><i id="hu" style="background:#e93"></i></div></div>
 <div>💧 Thirst<div class="stat"><i id="th" style="background:#39f"></i></div></div>
 <div id="weap">Weapon: Fists</div><div id="dayl"></div>
</div>
<div id="count" class="hidden"></div><div id="msg"></div><div id="cross" class="hidden"></div><div id="hint"></div><div id="danger"></div>
<div id="touch" class="hidden"><div class="joy" id="joyL"><span>MOVE</span><div class="knob"></div></div><div class="joy" id="joyR"><span>LOOK</span><div class="knob"></div></div></div>
<div id="btns" class="hidden"><div data-b="cam">CAM</div><div data-b="jump">JUMP</div><div data-b="use">GRAB</div><div data-b="atk" style="background:#a226">ATK</div></div>
<script type="module" src="game.js"></script>
</body></html>
